services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_HIGH_QUALITY_MODEL: ${DEEPSEEK_HIGH_QUALITY_MODEL:-deepseek-v4-pro}
      SEARXNG_URL: http://searxng:8080
      DATABASE_URL: file:/data/youlong.sqlite
      APP_ACCESS_PASSWORD_HASH: ${APP_ACCESS_PASSWORD_HASH:-}
    volumes:
      - youlong-data:/data
    depends_on:
      - searxng

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    environment:
      BASE_URL: http://localhost:8080/
      INSTANCE_NAME: youlong-paipai-search
    volumes:
      - ./deploy/searxng:/etc/searxng

volumes:
  youlong-data:
