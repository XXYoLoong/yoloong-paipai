use_default_settings: true

general:
  debug: false
  instance_name: "youlong-paipai-search"

search:
  safe_search: 1
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080
  secret_key: "youlong-paipai-local-dev-change-before-public-deploy"
  limiter: false
  image_proxy: false
  method: "GET"

ui:
  default_locale: ""
